version: 2

project_name: stackctl

dist: cli/dist

builds:
  - dir: cli
    main: .
    binary: stackctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"

# Cask, not formula: a formula without a bottle is built from source, so
# Homebrew demands a compiler (build-essential / Xcode CLT) for a prebuilt binary.
homebrew_casks:
  - repository:
      owner: omattsson
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/omattsson/stackctl
    description: CLI for managing Kubernetes stack deployments via k8s-stack-manager
    license: MIT
    binaries:
      - stackctl
    hooks:
      post:
        # The binary is not signed or notarized.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/stackctl"]
          end

release:
  github:
    owner: omattsson
    name: stackctl
  draft: false
  # A rerun of a failed release (for example after the Homebrew step failed)
  # uploads the same file names again. Replace them instead of failing with
  # "422 already_exists".
  replace_existing_artifacts: true
