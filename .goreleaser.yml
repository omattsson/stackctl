version: 2

project_name: stackctl

dist: cli/dist

builds:
  - dir: cli
    main: .
    binary: stackctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"

# Cask, not formula: a formula without a bottle is built from source, so
# Homebrew demands a compiler (build-essential / Xcode CLT) for a prebuilt binary.
homebrew_casks:
  - repository:
      owner: omattsson
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/omattsson/stackctl
    description: CLI for managing Kubernetes stack deployments via k8s-stack-manager
    license: MIT
    binaries:
      - stackctl
    # A prerelease tag (for example v0.7.0-rc.1) does not update the tap.
    skip_upload: auto
    # The binary is not signed or notarized, so remove the quarantine attribute.
    # goreleaser v2.18 writes `hooks.post.install` as a `postflight` block, which
    # Homebrew deprecates (#126). `postflight_steps` is Homebrew's declarative
    # replacement (Homebrew 6.0.13 or later). goreleaser renders this block as a
    # template, so `{{ "{{staged_path}}" }}` keeps Homebrew's literal token.
    # Replace with `hooks.post.install_steps` when goreleaser supports it
    # (goreleaser/goreleaser#6873).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/stackctl"]
        end
      end

release:
  github:
    owner: omattsson
    name: stackctl
  draft: false
  # A prerelease tag (for example v0.7.0-rc.1) becomes a GitHub pre-release,
  # not the latest release.
  prerelease: auto
  # A rerun of a failed release (for example after the Homebrew step failed)
  # uploads the same file names again. Replace them instead of failing with
  # "422 already_exists".
  replace_existing_artifacts: true
