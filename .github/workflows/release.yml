name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install staticcheck
        working-directory: cli
        run: make tools
      - name: Run tests and lint
        working-directory: cli
        run: make test && make lint
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Release the pushed tag. Without it goreleaser takes the tag that
          # git describe finds, and a final tag on the same commit as a
          # release candidate (v0.7.0 and v0.7.0-rc.3) released the rc again.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
